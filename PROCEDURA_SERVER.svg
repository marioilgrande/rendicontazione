<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ABAB5"/>
      <stop offset="100%" stop-color="#078f8a"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f7fa"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- BG -->
  <rect width="1200" height="1700" fill="#f4f7fa"/>

  <!-- HEADER -->
  <rect x="0" y="0" width="1200" height="140" fill="url(#hdr)"/>
  <circle cx="60" cy="70" r="8" fill="#ffffff"/>
  <circle cx="60" cy="70" r="20" fill="#ffffff" fill-opacity="0.25"/>
  <text x="100" y="62" fill="#ffffff" font-size="32" font-weight="800">Rendicontazione · Server Invio Mail</text>
  <text x="100" y="100" fill="#ffffff" fill-opacity="0.92" font-size="18" font-weight="500">Procedura per avviare il server locale e mandare le mail ai negozi</text>
  <text x="1140" y="60" fill="#ffffff" fill-opacity="0.85" font-size="13" text-anchor="end" font-weight="600">SETUP UNICO · ESECUZIONE MENSILE</text>

  <!-- SEZIONE A: SETUP INIZIALE (una sola volta) -->
  <rect x="30" y="170" width="1140" height="50" rx="10" fill="#0f172a"/>
  <text x="60" y="202" fill="#ffffff" font-size="20" font-weight="800">SETUP INIZIALE — UNA SOLA VOLTA</text>
  <text x="1140" y="202" fill="#ffffff" fill-opacity="0.7" font-size="14" text-anchor="end">Step 1 → 3</text>

  <!-- STEP 1 -->
  <g transform="translate(30,240)" filter="url(#shadow)">
    <rect width="1140" height="170" rx="14" fill="url(#step)" stroke="#e2e8f0"/>
    <circle cx="50" cy="50" r="26" fill="#0ABAB5"/>
    <text x="50" y="58" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">1</text>
    <text x="95" y="50" font-size="20" font-weight="800" fill="#0f172a">Apri il Terminale</text>
    <text x="95" y="78" font-size="14" fill="#475569">Mac → premi ⌘ Command + Spazio → scrivi "Terminale" → Invio</text>

    <rect x="95" y="100" width="990" height="50" rx="8" fill="#0b1220"/>
    <text x="110" y="132" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#a7f3d0">cd "/Users/marioisernia/Desktop/HTML MARIO/RENDICONTAZIONE/server"</text>
  </g>

  <!-- STEP 2 -->
  <g transform="translate(30,430)" filter="url(#shadow)">
    <rect width="1140" height="170" rx="14" fill="url(#step)" stroke="#e2e8f0"/>
    <circle cx="50" cy="50" r="26" fill="#0ABAB5"/>
    <text x="50" y="58" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">2</text>
    <text x="95" y="50" font-size="20" font-weight="800" fill="#0f172a">Configura la password della tua mail</text>
    <text x="95" y="78" font-size="14" fill="#475569">Apri il file ".env" e sostituisci "METTI_QUI_LA_PASSWORD..." con la password reale della casella</text>

    <rect x="95" y="100" width="990" height="50" rx="8" fill="#0b1220"/>
    <text x="110" y="132" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#a7f3d0">open -e .env</text>
    <text x="1075" y="132" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#94a3b8" text-anchor="end">(si apre TextEdit)</text>
  </g>

  <!-- STEP 3 -->
  <g transform="translate(30,620)" filter="url(#shadow)">
    <rect width="1140" height="200" rx="14" fill="url(#step)" stroke="#e2e8f0"/>
    <circle cx="50" cy="50" r="26" fill="#0ABAB5"/>
    <text x="50" y="58" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">3</text>
    <text x="95" y="50" font-size="20" font-weight="800" fill="#0f172a">Installa le librerie (già fatto, ma rifallo se cambi Mac)</text>
    <text x="95" y="78" font-size="14" fill="#475569">Una sola volta. Scarica i pacchetti che servono al server.</text>

    <rect x="95" y="100" width="990" height="50" rx="8" fill="#0b1220"/>
    <text x="110" y="132" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#a7f3d0">npm install</text>

    <text x="95" y="178" font-size="13" fill="#64748b">Vedrai: "added 87 packages…" → tutto ok.</text>
  </g>

  <!-- SEZIONE B: USO MENSILE -->
  <rect x="30" y="850" width="1140" height="50" rx="10" fill="#078f8a"/>
  <text x="60" y="882" fill="#ffffff" font-size="20" font-weight="800">USO QUOTIDIANO — OGNI VOLTA CHE VUOI INVIARE</text>
  <text x="1140" y="882" fill="#ffffff" fill-opacity="0.9" font-size="14" text-anchor="end">Step 4 → 8</text>

  <!-- STEP 4 -->
  <g transform="translate(30,920)" filter="url(#shadow)">
    <rect width="560" height="170" rx="14" fill="url(#step)" stroke="#e2e8f0"/>
    <circle cx="50" cy="50" r="26" fill="#078f8a"/>
    <text x="50" y="58" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">4</text>
    <text x="95" y="50" font-size="18" font-weight="800" fill="#0f172a">Apri Terminale e vai nella cartella</text>
    <rect x="95" y="78" width="445" height="42" rx="8" fill="#0b1220"/>
    <text x="105" y="105" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#a7f3d0">cd "/Users/marioisernia/Desktop/HTML MARIO/RENDICONTAZIONE/server"</text>
    <text x="95" y="148" font-size="12" fill="#64748b">Suggerimento: tieni il comando salvato in note.</text>
  </g>

  <!-- STEP 5 -->
  <g transform="translate(610,920)" filter="url(#shadow)">
    <rect width="560" height="170" rx="14" fill="url(#step)" stroke="#e2e8f0"/>
    <circle cx="50" cy="50" r="26" fill="#078f8a"/>
    <text x="50" y="58" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">5</text>
    <text x="95" y="50" font-size="18" font-weight="800" fill="#0f172a">Avvia il server</text>
    <rect x="95" y="78" width="445" height="42" rx="8" fill="#0b1220"/>
    <text x="105" y="105" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#a7f3d0">npm start</text>
    <text x="95" y="148" font-size="12" fill="#64748b">Vedi: "in ascolto su http://localhost:5170" → server attivo.</text>
  </g>

  <!-- STEP 6 -->
  <g transform="translate(30,1110)" filter="url(#shadow)">
    <rect width="560" height="170" rx="14" fill="url(#step)" stroke="#e2e8f0"/>
    <circle cx="50" cy="50" r="26" fill="#078f8a"/>
    <text x="50" y="58" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">6</text>
    <text x="95" y="50" font-size="18" font-weight="800" fill="#0f172a">Apri il pannello HTML</text>
    <text x="95" y="78" font-size="14" fill="#475569">Doppio click su rendinew.html.</text>
    <rect x="95" y="100" width="445" height="60" rx="8" fill="#eafaf9" stroke="#bfecea"/>
    <circle cx="115" cy="130" r="6" fill="#0ea371"/>
    <text x="130" y="135" font-size="13" fill="#056e6a" font-weight="700">In alto a destra l'indicatore "Server: online" diventa verde.</text>
  </g>

  <!-- STEP 7 -->
  <g transform="translate(610,1110)" filter="url(#shadow)">
    <rect width="560" height="170" rx="14" fill="url(#step)" stroke="#e2e8f0"/>
    <circle cx="50" cy="50" r="26" fill="#078f8a"/>
    <text x="50" y="58" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">7</text>
    <text x="95" y="50" font-size="18" font-weight="800" fill="#0f172a">Importa Excel, scegli AM/negozi</text>
    <text x="95" y="78" font-size="14" fill="#475569">Filtra come al solito. Poi clicca:</text>
    <rect x="95" y="98" width="445" height="42" rx="10" fill="#10b981"/>
    <text x="318" y="125" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">📧 Invia mail a tutti i negozi</text>
    <text x="95" y="160" font-size="12" fill="#64748b">Si apre l'anteprima: spunta i negozi a cui inviare.</text>
  </g>

  <!-- STEP 8 -->
  <g transform="translate(30,1300)" filter="url(#shadow)">
    <rect width="1140" height="200" rx="14" fill="url(#step)" stroke="#e2e8f0"/>
    <circle cx="50" cy="50" r="26" fill="#078f8a"/>
    <text x="50" y="58" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">8</text>
    <text x="95" y="50" font-size="18" font-weight="800" fill="#0f172a">Conferma e guarda il log</text>
    <text x="95" y="78" font-size="14" fill="#475569">Click su "Invia ora": parte l'invio mail per mail con allegato Excel personalizzato.</text>

    <rect x="95" y="100" width="990" height="80" rx="8" fill="#0b1220"/>
    <text x="110" y="125" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#93c5fd">[10:24:12] Avvio invio di 38 mail (mese: marzo).</text>
    <text x="110" y="145" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#86efac">[10:24:13] ✔ inviata a NEGOZIO ROMA SUD</text>
    <text x="110" y="165" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#86efac">[10:24:14] ✔ inviata a NEGOZIO MILANO CENTRO</text>
  </g>

  <!-- FOOTER WARNING -->
  <g transform="translate(30,1530)">
    <rect width="1140" height="140" rx="14" fill="#fff4dc" stroke="#fcd34d"/>
    <text x="60" y="40" font-size="18" font-weight="800" fill="#7c4a03">⚠  COSE DA RICORDARE</text>
    <text x="60" y="68" font-size="13.5" fill="#7c4a03">•  Tieni il Terminale APERTO mentre invii. Quando finisci premi Ctrl+C per chiudere.</text>
    <text x="60" y="90" font-size="13.5" fill="#7c4a03">•  La password della casella sta nel file ".env" sul tuo Mac. Non condividerlo.</text>
    <text x="60" y="112" font-size="13.5" fill="#7c4a03">•  Se SMTP rifiuta: prova SMTP_HOST=smtps.register.it nel .env, oppure verifica la password.</text>
  </g>
</svg>
